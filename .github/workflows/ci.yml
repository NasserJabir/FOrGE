name: FOrGE CI

on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
    branches: [main]

# C-11 / DEC-30: policies are data on a protected branch; CI is the enforcement
# surface for design constraints (C-02, C-03, C-04, C-09, NFR-10, NFR-11).

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (closed list per C-01)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format

      - name: Type-check (tsc strict)
        run: npm run build

      - name: CI guards (C-02/C-03/C-04/C-09/NFR-10)
        run: npm run ci-guards

      - name: Tests + coverage (NFR-11: >=90% kernel)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
